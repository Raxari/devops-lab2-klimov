name: Verify lab 2
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the reconstructed project
        shell: bash
        run: |
          set -euo pipefail
          dd if=/dev/zero of=dump.sql bs=1M count=1
          docker build --build-arg VERSION=1.0 -t klimov-01/probe:0.9 .
          docker run --rm klimov-01/probe:0.9 cat /app/VERSION
          test "$(docker run --rm -e VERSION=999 klimov-01/probe:0.9 cat /app/VERSION)" = 1.0
          docker run --rm klimov-01/probe:0.9 sh -c 'test ! -e /app/dump.sql && test ! -d /app/.git'
          docker run -d --name lr2-a -p 5001:5001 klimov-01/probe:0.9
          docker run -d --name lr2-b -p 5002:5001 -e MARKER=drugoe -e VERSION=999 klimov-01/probe:0.9
          for i in $(seq 30); do curl -fsS http://127.0.0.1:5001/me >/dev/null && curl -fsS http://127.0.0.1:5002/me >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5001/me | tee /tmp/me-a.json
          curl -fsS http://127.0.0.1:5002/me | tee /tmp/me-b.json
          curl -fsS http://127.0.0.1:5001/uptime | tee /tmp/uptime.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/me-a.json'));b=json.load(open('/tmp/me-b.json'));u=json.load(open('/tmp/uptime.json'))
          assert a['student']=='Климов Иван Андреевич' and a['group']=='БИСТ-23-ПО-2'
          assert a['marker']=='sitelab' and b['marker']=='drugoe'
          assert a['version']==b['version']=='1.0'
          assert a['hostname']!=b['hostname']
          assert u['marker']=='sitelab' and isinstance(u['uptime_seconds'],(float,int)) and u['uptime_seconds']>=0
          print('Docker build, identity, MARKER, VERSION, uptime and .dockerignore verified')
          PY
          docker rm -f lr2-a lr2-b
